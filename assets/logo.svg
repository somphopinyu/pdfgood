<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="docGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="docGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Badge / Icon Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />

  <!-- Back PDF Document -->
  <g filter="url(#dropShadow)" transform="translate(130, 110) rotate(-8)">
    <rect x="0" y="0" width="180" height="240" rx="16" fill="#e2e8f0" opacity="0.8" />
    <line x1="30" y1="50" x2="130" y2="50" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />
    <line x1="30" y1="80" x2="150" y2="80" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
    <line x1="30" y1="110" x2="110" y2="110" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Front PDF Document -->
  <g filter="url(#dropShadow)" transform="translate(190, 130) rotate(4)">
    <rect x="0" y="0" width="190" height="250" rx="16" fill="url(#docGrad1)" />
    <!-- PDF Ribbon / Header -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 174 0 C 182.84 0 190 7.16 190 16 L 190 60 L 0 60 Z" fill="#ef4444" />
    <text x="95" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>
    
    <!-- Lines -->
    <line x1="30" y1="95" x2="160" y2="95" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    <line x1="30" y1="125" x2="140" y2="145" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <line x1="30" y1="155" x2="160" y2="155" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
    <line x1="30" y1="185" x2="110" y2="185" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Merge / Plus Sparkle Badge -->
  <g filter="url(#dropShadow)" transform="translate(320, 310)">
    <circle cx="50" cy="50" r="46" fill="#10b981" />
    <path d="M 50 26 L 50 74 M 26 50 L 74 50" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
